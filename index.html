<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Rota Cultural</title>
    <link rel="stylesheet" href="/src/styles/global.css">
</head>

<body>
    <!-- ======================================================
        Header/Hero
    ==========================================================-->
    <header>
        <img src="src/assets/imgs/Logo-RotaCultural.svg" alt="Logo Rota Cultural">
        <div class="meio-header">
            <nav></nav>
            <div class="pesquisa"></div>
        </div>
        <div class="login-cadastro">
            <button>Login</button>
            <button>Cadastro</button>
        </div>
    </header>

    <!-- ======================================================
        Main
    ==========================================================-->
    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="text-hero">
                    <h1></h1>
                    <p></p>
                </div>
                <img src="" alt="">
            </div>
            <div class="hero-forms">
                <div class="card-forms">
                    <h2></h2>
                    <div>
                        <img src="" alt="">
                        <p></p>
                    </div>
                </div>
                <div class="card-forms">
                    <h2></h2>
                    <div>
                        <img src="" alt="">
                        <p></p>
                    </div>
                </div>
                <div class="card-forms">
                    <h2></h2>
                    <div>
                        <img src="" alt="">
                        <p></p>
                    </div>
                </div>
                <button></button>
            </div>
        </section>





        <!-- =====================================================
            Escolha de estado e cidade 
        ======================================================= -->
        <section class="info-estados">
            <div class="conteudo-top">
                <div class="conteudo-esquerda">
                    <div class="Titulo-escolha">
                        <h1>Escolha um estado</h1>
                        <p>Descubra cidades incríveis, viva experiências únicas.</p><br><br><br>
                    </div>
                    <nav class="estados-navegacao">
                        <ul class="lista-estados">
                            <li class="item-estado ativo"><a href="#">São Paulo</a></li>
                            <li class="item-estado"><a href="#">Minas Gerais</a></li>
                            <li class="item-estado"><a href="#">Rio de Janeiro</a></li>
                            <li class="item-estado"><a href="#">Mato Grosso</a></li>
                        </ul>
                    </nav>
                </div>
                <div class="mapa-interativo">
                    <img src="/src/assets/imgs/mapaInterativo.svg" alt="Mapa interativo">
                </div>

              
            </div>
            
            <div class="sub-titulo-escolha" id="cidade-SP">
                <h1>Cidades famosas em <span>São Paulo</span></h1>
                <h2>Explore o melhor que São Paulo tem a oferecer.</h2>
                <img src="/src/assets/imgs/itapevi.svg" alt="Itapevi">
                <img src="/src/assets/imgs/osasco.svg" alt="Osasco">
                <img src="/src/assets/imgs/praiaGrande.svg" alt="Praia Grande">
            </div>
            
        </section>
    </main>

    <!-- ======================================================
        Footer
    ==========================================================-->
    <footer></footer>

</body>

</html>
